<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Tracker - Real-Time Market Data & Price Alerts</title>

    <!-- HTML5 Meta Tags -->
    <meta name="description" content="Track real-time stock prices, monitor market data, and set price alerts for your favorite stocks. Built with modern web standards including WebSocket, HTML5, and Schema.org microdata." />
    <meta name="keywords" content="stock tracker, real-time stocks, market data, price alerts, financial data, web standards" />
    <meta name="author" content="Stock Tracker" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://stock-tracker.com/" />
    <meta property="og:title" content="Stock Tracker - Real-Time Market Data" />
    <meta property="og:description" content="Track real-time stock prices and monitor your favorite tickers with live market data." />
    <meta property="og:image" content="https://stock-tracker.com/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://stock-tracker.com/" />
    <meta property="twitter:title" content="Stock Tracker - Real-Time Market Data" />
    <meta property="twitter:description" content="Track real-time stock prices and monitor your favorite tickers with live market data." />
    <meta property="twitter:image" content="https://stock-tracker.com/og-image.jpg" />

    <!-- Schema.org JSON-LD for WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Stock Tracker",
      "description": "Real-time stock market tracking application with price alerts and watchlist functionality",
      "url": "https://stock-tracker.com",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Real-time stock price tracking",
        "Price alerts and notifications",
        "Customizable watchlist",
        "Market status indicators",
        "Top 10 stocks by market cap"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
