[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Client-side routes (/watchlist, /alerts, /stock/AAPL) all load the SPA.
# /api/* is handled by netlify/functions/api.mjs before this rule applies.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
